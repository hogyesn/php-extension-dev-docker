version: '3.8'

services:
  php-extension-dev:
    build: .
    container_name: php-extension-dev
    tty: true
    volumes:
      - ./php.ini:/usr/local/php-bin/DEBUG/etc/php.ini
      - ./extensions:/extensions
      - ./debug_scripts:/debug_scripts
    ports:
      - "3333:3333"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
